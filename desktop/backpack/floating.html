<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"><title>POE2 收益浮窗</title><link rel="stylesheet" href="floating.css"></head><body>
<header><b>背包收益</b><button id="openMain">大窗 ↗</button><button id="market">补货</button><details id="appearance"><summary>设置</summary><div class="settings"><label><span>置顶</span><input id="pin" type="checkbox"></label><label><span>不透明度 <output id="opacityValue">100%</output></span><input id="opacity" type="range" min="40" max="100" step="5"></label><label><span>高对比文字</span><input id="contrast" type="checkbox"></label><label><span>文字颜色</span><input id="textColor" type="color" value="#ffffff"></label></div></details></header>
<div class="metrics"><div id="profitArea" tabindex="0" aria-label="本轮净收益，悬停查看产出明细"><span>本轮净收益</span><strong id="net">—</strong></div><div><span>累计产出</span><strong id="output">—</strong></div></div><div class="market-alert-line"><span>提醒</span><b id="marketAlert">暂无低价提醒</b><button id="alertJump" disabled>跳转 ↗</button></div>
<div class="controls"><button id="scan" class="primary">扫描背包</button><button id="pause">暂停</button><button id="undo" disabled>撤回</button></div><div id="notice" hidden><span id="status"></span><button id="review" hidden>大窗核对 ↗</button></div>
<script src="floating.js"></script></body></html>
